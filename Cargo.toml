[workspace]
resolver = "3"
members = ["core", "viewer", "protocol", "server"]
# Eigener Workspace, damit Cargo den Untergrund nie per Feature-Vereinigung in den Client
# zieht (D-005, #10).
exclude = ["gdext"]
default-members = ["viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
