[package]
name = "terraforge-viewer"
description = "Bevy-Viewer und Debug-Tools fuer terraforge-core"
version.workspace = true
edition.workspace = true
default-run = "terraforge"

[[bin]]
name = "terraforge"
path = "src/main.rs"

[dependencies]
terraforge-core = { path = "../core" }
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "default_app",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_image",
    "bevy_shader",
    "bevy_material",
    "bevy_color",
    "bevy_window",
    "bevy_camera_controller",
    "free_camera",
    "bevy_ui_render",
    "default_font",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
